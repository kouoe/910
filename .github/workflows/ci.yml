name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build without tests
        run: mvn -B clean package -DskipTests --file backend/pom.xml

      - name: Run unit tests
        # Some tests require a live MySQL / Milvus instance, so failures here
        # are reported but do not block the pipeline.
        run: mvn -B test --file backend/pom.xml
        continue-on-error: true
